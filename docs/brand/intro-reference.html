  .spot{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 45% 55% at 50% 42%,rgba(255,220,150,.35),transparent 70%);opacity:0}
  .vignette{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

  .logo{position:absolute;left:0;top:0;width:400px;transform:scale(0);transform-origin:64% 99%;
      filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
  .logo{z-index:2}
  .host{z-index:1;position:absolute;bottom:3%;left:6%;height:min(80vh,780px);transform:translateX(-140%);
      filter:drop-shadow(0 20px 25px rgba(0,0,0,.45));transform-origin:50% 100%}
  .bubble{position:absolute;left:calc(6% + min(80vh,780px)*.5);bottom:calc(3% + min(80vh,780px)*.33);
      background:var(--cream);color:var(--brown);font-weight:700;font-size:clamp(16px,1.8vw,26px);
      padding:.6em 1em;border-radius:1.2em;border:4px solid var(--orange);box-shadow:0 8px 0 var(--rust);
      opacity:0;transform:scale(.4) rotate(-6deg);transform-origin:0 100%;white-space:nowrap}
  .bubble:after{content:"";position:absolute;left:18px;bottom:-18px;border:12px solid transparent;border-top-color:var(--orange)}

  .actions{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .btn{font:inherit;font-weight:700;font-size:clamp(20px,2.2vw,34px);padding:.55em 1.4em;border-radius:999px;cursor:pointer;
      border:4px solid var(--bulb);color:var(--cream);background:linear-gradient(180deg,#f07a2a,var(--orange) 55%,var(--rust));
      box-shadow:0 8px 0 var(--brown),0 0 0 rgba(253,188,95,0);opacity:0;transform:translateY(40px)}
  .btn.secondary{background:linear-gradient(180deg,#2c9791,var(--petrol) 55%,var(--petrol-dark))}
  .btn:active{transform:translateY(6px)!important;box-shadow:0 2px 0 var(--brown)}
  .replay{position:absolute;top:14px;right:14px;font:inherit;font-size:14px;color:var(--cream);background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;cursor:pointer;opacity:.7}
  canvas{position:absolute;inset:0;pointer-events:none}

  /* ---------- animation states ---------- */
  .play .bg{animation:lights 2.2s steps(1) forwards, settle 2.2s ease-out forwards}
  @keyframes lights{0%{filter:brightness(.08) saturate(.6)}30%{filter:brightness(.35) saturate(.8)}
     45%{filter:brightness(.15) saturate(.7)}60%{filter:brightness(.7) saturate(.95)}100%{filter:brightness(.92) saturate(1)}}
  @keyframes settle{to{transform:scale(1)}}
  .play .spot{animation:spot 1.2s 1.6s ease-out forwards}
  @keyframes spot{to{opacity:1}}
  .play .logo{animation:pop .9s 2.1s cubic-bezier(.2,1.6,.4,1) forwards, float 4s 3.2s ease-in-out infinite, glow 1.6s 3.2s ease-in-out infinite}
  @keyframes pop{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes float{0%,100%{scale:1}50%{scale:1.015}}
  @keyframes glow{0%,100%{filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)) drop-shadow(0 0 0 rgba(253,188,95,0))}
     50%{filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)) drop-shadow(0 0 28px rgba(253,188,95,.75))}}
  .play .host{animation:walk 1.6s 3s cubic-bezier(.3,.7,.4,1) forwards, sway 2.6s 4.8s ease-in-out infinite}
  @keyframes walk{0%{transform:translateX(-140%) rotate(0)}20%{transform:translateX(-110%) translateY(-10px) rotate(-3deg)}
     40%{transform:translateX(-75%) rotate(2deg)}60%{transform:translateX(-40%) translateY(-10px) rotate(-3deg)}
     80%{transform:translateX(-8%) rotate(2deg)}90%{transform:translateX(3%) rotate(-1deg)}100%{transform:translateX(0) rotate(0)}}
  @keyframes sway{0%,100%{rotate:0deg}50%{rotate:1.5deg}}
  .play .bubble{animation:bubble .5s 4.7s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes bubble{to{opacity:1;transform:scale(1) rotate(-3deg)}}
  .play .btn{animation:rise .6s cubic-bezier(.2,1.4,.4,1) forwards, pulse 1.8s ease-in-out infinite}
  .play .btn:nth-child(1){animation-delay:5.2s,6s}
  .play .btn:nth-child(2){animation-delay:5.4s,6.4s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{box-shadow:0 8px 0 var(--brown),0 0 0 rgba(253,188,95,0)}50%{box-shadow:0 8px 0 var(--brown),0 0 26px rgba(253,188,95,.8)}}

  <canvas id="confetti"></canvas>
  <div class="vignette"></div>
  <div class="actions">
    <button class="btn">Neues Spiel</button>
    <button class="btn secondary">Beitreten</button>
  </div>
  <button class="replay" id="replay">↻ Nochmal abspielen</button>
</div>
<script>

/* Logo anchored to the background image: the sofa stands on the round stage */
const BG={wide:{w:1672,h:941,floorX:836,floorY:735,logoW:760},tall:{w:941,h:1672,floorX:470,floorY:1040,logoW:860}};
const LOGO={sofaX:0.64,feetY:0.988,ratio:731/1100};
const logo=document.querySelector('.logo');
function place(){
  const W=innerWidth,H=innerHeight,b=(W/H<=0.75)?BG.tall:BG.wide;
  const s=Math.max(W/b.w,H/b.h), ox=(W-b.w*s)/2, oy=(H-b.h*s)/2;
  let lw=Math.min(b.logoW*s,W*0.96), lh=lw*LOGO.ratio;
  const fx=ox+b.floorX*s, fy=oy+b.floorY*s;
  if(fy-lh<8){lh=fy-8;lw=lh/LOGO.ratio;}
  const tall=b===BG.tall;
  if(tall){lw=Math.min(lw,W*0.74);lh=lw*LOGO.ratio;}
  let left=fx-lw*LOGO.sofaX; left=Math.max(W*0.02,Math.min(left,W*0.98-lw));
  if(tall) left=W*0.96-lw;               /* phones: logo to the right */
  logo.style.width=lw+'px';
  logo.style.left=left+'px';
  const host=document.querySelector('.host');
  if(tall){                               /* phones: host cut off at the left, never in front of the logo */
    const hh=Math.min(H*0.42,(fy+H*0.06)), hw=hh*(1123/520)**-1;
    host.style.height=hh+'px';
    host.style.top=(fy+H*0.05-hh)+'px';
    host.style.left=Math.max(left-hw*0.8,-hw*0.25)+'px';
  } else {host.style.height='';host.style.top='';host.style.left='';}
  logo.style.top=(fy-lh*LOGO.feetY)+'px';
}
addEventListener('resize',place);place();
const stage=document.getElementById('stage');
const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
let parts=[],raf,timer;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',resize);resize();
const colors=['#fdbc5f','#e15a14','#217b77','#fff3d6','#cc3e05'];
function burst(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cx=cv.width/2,cy=cv.height*0.3;
  for(let i=0;i<160;i++){const a=Math.random()*Math.PI*2,s=(4+Math.random()*10)*devicePixelRatio;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6*devicePixelRatio,w:(6+Math.random()*8)*devicePixelRatio,
      h:(4+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],life:1});}
  cancelAnimationFrame(raf);tick();
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.006;
    ctx.save();ctx.globalAlpha=Math.max(p.life,0);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+50);
  if(parts.length)raf=requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);
}
function play(){
  stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');
  clearTimeout(timer);parts=[];timer=setTimeout(burst,2400);
}
document.getElementById('replay').onclick=play;
play();
</script>
